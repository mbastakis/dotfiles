# Repo-local mise config for the chezmoi dotfiles repo.
# Source-only: excluded from chezmoi apply via .chezmoiignore.
#
# Pins go-task (registry key: `task`, aqua:go-task/task) to an exact version
# for this repo's Taskfile.yml workflows, independent of whatever version the
# global mise config (private_dot_config/mise/config.toml) currently installs.
# go-task is also global via that config, so `task` resolves to it everywhere,
# not just here; Taskwarrior is reached via `tw` instead — see
# literal_bin/executable_tw.
#
# Trust: this directory is pre-trusted via MISE_TRUSTED_CONFIG_PATHS in
# dot_zshenv.tmpl (resolves to $DOTFILES_PATH / chezmoi sourceDir).

[tools]
task = "3.52.0"
node = "24.18.0"
pre-commit = "4.6.0"
shellcheck = "0.11.0"
yamllint = "1.38.0"
uv = "0.8.22"
