config-version = 2

# Start AeroSpace at login and reload this file when it changes.
start-at-login = true
auto-reload-config = true

# AeroSpace owns the borders process lifecycle; bordersrc owns its appearance.
# Launch the primary apps and let the helper construct their nested layout.
after-startup-command = [
  'exec-and-forget borders',
  'exec-and-forget /usr/bin/open -a Vivaldi',
  'exec-and-forget /usr/bin/open -a Ghostty',
  "exec-and-forget /bin/bash -lc 'open \"$HOME/Applications/Vivaldi Apps.localized/Sisyphus.app\"'",
  'exec-and-forget /usr/bin/open -a Obsidian',
  "exec-and-forget /bin/bash -lc '$HOME/bin/aerospace-startup-layout'",
]

# Version 2 requires persistent workspaces to be declared explicitly.
persistent-workspaces = ['a', 'o', 'e', 'u']

# Keep SketchyBar's workspace state synchronized with AeroSpace.
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focus-changed = [
  'move-mouse window-lazy-center',
  'exec-and-forget /bin/bash -c "sketchybar --trigger aerospace_focus_change WINDOW_ID=${AEROSPACE_WINDOW_ID:-}"',
] # Mouse and SketchyBar follow any focus (window or workspace)

key-mapping.preset = 'dvorak'

on-window-detected = [
  # Workspace A
  { if = 'test %{app-name} ~= Comet', run = 'move-node-to-workspace a' },
  { if = 'test %{app-name} ~= Chrome', run = 'move-node-to-workspace a' },

  # Workspace O
  { if = 'test %{app-bundle-id} = "com.vivaldi.Vivaldi"', run = 'move-node-to-workspace o' },
  { if = 'test %{app-bundle-id} = "com.mitchellh.ghostty"', run = 'move-node-to-workspace o' },
  { if = 'test %{app-bundle-id} = "com.vivaldi.Vivaldi.app.hempoeacjmlcffkchdampdabegkfjoeo"', run = 'move-node-to-workspace o' },
  { if = 'test %{app-bundle-id} = "md.obsidian"', run = 'move-node-to-workspace o' },

  # Workspace E
  { if = 'test %{app-name} ~= Spotify', run = 'move-node-to-workspace e' },
  { if = 'test %{app-name} ~= Discord', run = 'move-node-to-workspace e' },

  # Workspace U
  { if = 'test %{app-name} ~= "Microsoft Teams"', run = 'move-node-to-workspace u' },
  { if = 'test %{app-name} ~= Outlook', run = 'move-node-to-workspace u' },
  { if = 'test %{app-name} ~= Slack', run = 'move-node-to-workspace u' },

  # Floating windows
  { if = 'test %{app-bundle-id} = "com.vivaldi.Vivaldi.app.gnfignpbnagdlnhkkammeaimojkedben"', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = "com.vicinaehq.Vicinae"', run = 'layout floating' },
  { if = 'test %{app-name} ~= Finder', run = 'layout floating' },
  { if = 'test %{app-name} ~= AppCleaner', run = 'layout floating' },
  { if = 'test %{app-name} ~= "System Preferences"', run = 'layout floating' },
  { if = 'test %{app-name} ~= GIMP', run = 'layout floating' },
]

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
# Reserve the floating 40px SketchyBar plus the same 10px outer gap.
outer.top = 56
outer.right = 10


[mode.main.binding]

alt-ctrl-shift-f = 'fullscreen'
alt-ctrl-f = 'layout floating tiling'

alt-ctrl-h = 'join-with left'
alt-ctrl-t = 'join-with down'
alt-ctrl-n = 'join-with up'
alt-ctrl-s = 'join-with right'

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-h = 'focus left'
alt-t = 'focus down'
alt-n = 'focus up'
alt-s = 'focus right'

alt-shift-h = 'move left'
alt-shift-t = 'move down'
alt-shift-n = 'move up'
alt-shift-s = 'move right'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-a = 'workspace a'
alt-o = 'workspace o'
alt-e = 'workspace e'
alt-u = 'workspace u'

alt-shift-a = 'move-node-to-workspace a --focus-follows-window'
alt-shift-o = 'move-node-to-workspace o --focus-follows-window'
alt-shift-e = 'move-node-to-workspace e --focus-follows-window'
alt-shift-u = 'move-node-to-workspace u --focus-follows-window'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
  'layout floating tiling',
  'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']
