# Global mise config (chezmoi-managed) - ~/.config/mise/config.toml
#
# Installs go-task globally under its native `task` command name. mise's
# `activate` PATH manipulation takes priority over Homebrew's, so this makes
# `task` resolve to go-task in every shell, in every repo, not just this one.
#
# go-task is managed by mise rather than Homebrew.
[tools]
task = "3.52.0"
"npm:@mermaid-js/mermaid-cli" = "11.17.0"
