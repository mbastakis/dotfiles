name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install mise
        uses: jdx/mise-action@c8f9c7c36eddd2bfb5335aa41b44f53bf2b0fe9d # v3

      - name: Run lint
        run: mise exec -- task lint

      - name: Run workstation tests
        run: mise exec -- task test
