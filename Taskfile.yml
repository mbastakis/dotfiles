# go-task runner for the chezmoi dotfiles repo.
# Source-only: excluded from chezmoi apply via .chezmoiignore.
# Invoked as `mise exec -- task <name>` (go-task; see mise.toml).
# Outside this repo, `task` resolves to Taskwarrior (brew).
# Docs: https://taskfile.dev/

version: "3"

tasks:
  default:
    desc: List repository workflows
    cmds:
      - task --list --sort=none
    silent: true

  check:
    desc: Run the full repository validation suite
    preconditions:
      - sh: command -v pre-commit
        msg: "pre-commit not found; run: mise install"
    cmds:
      - pre-commit run --all-files

  brewfile:refresh:
    desc: Rewrite the source Brewfile from installed packages
    preconditions:
      - sh: command -v brew
        msg: "Homebrew not found; install it from https://brew.sh"
    cmds:
      - brew bundle dump --force --file=private_dot_config/brew/Brewfile

  docs:serve:
    desc: Serve the documentation on http://localhost:3000
    preconditions:
      - sh: command -v npx
        msg: "npx not found; run: mise install"
    cmds:
      - npx --yes docsify-cli serve docs
