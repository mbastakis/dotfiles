# Let prompts and messages temporarily replace the themed window list instead
# of drawing over it. The normal status content returns when they close.
set -g status-style "bg=#0d0d10,fg=#ebe7ed"
set -g message-style "bg=#0d0d10,fg=#ebe7ed,fill=#0d0d10,width=100%,align=left"
set -g message-command-style "bg=#0d0d10,fg=#ebe7ed,fill=#0d0d10,width=100%,align=left"

# Pane borders: tmux draws shared separator cells, not independent pane boxes.
# Use thin colored separators and pane labels for a boxed-pane approximation.
set -g pane-border-indicators off
set -g pane-border-lines single
set -g pane-border-style "fg=#30303d,bg=default"
set -g pane-active-border-style "fg=#d48aa4,bg=default"
set -g pane-border-status top
set -g pane-border-format "#[align=centre]"
