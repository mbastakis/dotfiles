<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mbastakis dotfiles</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Documentation for mbastakis chezmoi-managed dotfiles" />
    <meta name="theme-color" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="icon"
      href="favicon.svg"
    />
    <!-- Docsify themeable base (layout) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css"
    />
    <!-- Ready-made native stylesheet from Nocturne Rose -->
    <link rel="stylesheet" href="theme.css" />
    <script>
      document.querySelector('meta[name="theme-color"]').content =
        getComputedStyle(document.documentElement).getPropertyValue("--nocturne-base").trim();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!--
      Config must be a classic script that runs BEFORE the plugin scripts
      below: they register themselves into window.$docsify.plugins at load
      time and throw if it does not exist yet.
    -->
    <script>
      let svgCounter = 0;

      window.$docsify = {
        name: "dotfiles",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        search: {
          placeholder: "Search  ( / )",
          noData: "No results",
          paths: "auto",
          depth: 3,
        },
        pagination: {
          previousText: "Previous",
          nextText: "Next",
          crossChapter: true,
        },
        plugins: [
          (hook, vm) => {
            hook.beforeEach(
              (content) =>
                `${content}\n\n<div class="page-edit"><a href="https://github.com/mbastakis/dotfiles/edit/main/docs/${vm.route.file}" target="_blank" rel="noopener">Edit this page on GitHub</a></div>`
            );
          },
        ],
        markdown: {
          renderer: {
            code(code, lang) {
              // window.renderMermaid is defined by the module below, which
              // executes before docsify renders any markdown.
              if (lang === "mermaid" && window.renderMermaid) {
                const svgName = `mermaid-svg-${svgCounter++}`;
                const containerId = `${svgName}-container`;
                window.renderMermaid(svgName, code, containerId);
                return `<div class="mermaid" id="${containerId}"></div>`;
              }
              return this.origin.code.apply(this, arguments);
            },
          },
        },
      };

      // "/" or Cmd/Ctrl+K focuses search; Escape leaves it.
      document.addEventListener("keydown", (e) => {
        const input = document.querySelector(".search input");
        if (!input) return;
        const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
        if ((e.key === "/" && !typing) || ((e.metaKey || e.ctrlKey) && e.key === "k")) {
          e.preventDefault();
          input.focus();
        } else if (e.key === "Escape" && document.activeElement === input) {
          input.blur();
        }
      });
    </script>
    <script type="module" data-cfasync="false">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

      const themeColor = (name) =>
        getComputedStyle(document.documentElement).getPropertyValue(name).trim();

      mermaid.initialize({
        startOnLoad: false,
        theme: "dark",
        themeVariables: {
          primaryColor: themeColor("--nocturne-rose"),
          primaryTextColor: themeColor("--nocturne-text"),
          primaryBorderColor: themeColor("--nocturne-rose-dim"),
          lineColor: themeColor("--nocturne-muted"),
          secondaryColor: themeColor("--nocturne-surface"),
          tertiaryColor: themeColor("--nocturne-mantle"),
          background: themeColor("--nocturne-base"),
          mainBkg: themeColor("--nocturne-surface"),
          nodeBorder: themeColor("--nocturne-overlay-high"),
          clusterBkg: themeColor("--nocturne-mantle"),
          titleColor: themeColor("--nocturne-text"),
          edgeLabelBackground: themeColor("--nocturne-overlay"),
          nodeTextColor: themeColor("--nocturne-text"),
        },
      });

      window.renderMermaid = (svgName, code, containerId) => {
        mermaid.render(svgName, code).then(({ svg }) => {
          const el = document.querySelector(`#${containerId}`);
          if (el) {
            el.innerHTML = svg;
          } else {
            console.error(`Mermaid container #${containerId} not found`);
          }
        });
      };
    </script>
    <!-- Docsify v4 -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <!-- Search plugin -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <!-- Click-to-zoom images -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
    <!-- Copy code button -->
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <!-- Prev / next page links -->
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  </body>
</html>
